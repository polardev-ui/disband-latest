<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The message that lifts off the phone and docks into the desktop chat in
     the cross-device sync shot. Same content and styling as the chat row. -->
<style>
@font-face { font-family: "Inter"; src: url("../assets/fonts/InterVariable-latin.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 380px; height: 84px; background: transparent; overflow: hidden; }
body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.012em; }
.card { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(180deg, #202125, #17181b); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.av { width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(135deg,#7b86ff,#5865f2 55%,#3d44c9); display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 18px; flex: none; }
.who { display: flex; align-items: baseline; gap: 7px; }
.who b { font-size: 15.5px; font-weight: 700; color: #9aa3ff; }
.who i { font-style: normal; font-size: 12px; color: #949ba4; }
.t { font-size: 16px; color: #f2f3f5; margin-top: 2px; white-space: nowrap; }
.t img { width: 19px; height: 19px; vertical-align: -4px; }
</style>
</head>
<body>
<div class="card"><div class="av">R</div><div><div class="who"><b>Riley Park</b><i>now</i></div><div class="t">Perfect. See you tomorrow at 2 <img src="../assets/emoji/1f44b.svg"></div></div></div>
<script type="module">
await document.fonts.ready;
await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r)))));
document.body.dataset.ready = "1";
</script>
</body>
</html>
