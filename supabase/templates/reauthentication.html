<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify it's you</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <span style="display:none;max-height:0;overflow:hidden;mso-hide:all;">Enter this code in Disband to verify it's really you.</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f6f7f9;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="https://www.disband.dev/disband.png" alt="Disband" width="56" height="56" style="display:inline-block;width:56px;height:56px;border:0;outline:none;text-decoration:none;border-radius:14px;" />
            </td>
          </tr>
          <tr>
            <td>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#ffffff;border-radius:12px;border:1px solid #e8eaf0;box-shadow:0 1px 2px rgba(16,24,40,0.04),0 4px 12px rgba(16,24,40,0.04);">
                <tr>
                  <td style="height:4px;background:linear-gradient(90deg,#5865f2 0%,#4752c4 100%);border-radius:12px 12px 0 0;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
                <tr>
                  <td style="padding:40px 40px 32px;">
                    <h1 style="margin:0 0 12px;color:#1f2328;font-size:22px;font-weight:700;">Verify it's you</h1>
                    <p style="margin:0 0 28px;color:#6b7280;font-size:15px;line-height:1.6;">
                      Enter this code in Disband to confirm a sensitive change on your account.
                    </p>
                    <p style="margin:0 0 28px;padding:16px 20px;background-color:#f6f7f9;border:1px solid #e8eaf0;border-radius:8px;color:#1f2328;font-size:24px;font-weight:700;letter-spacing:10px;text-align:center;">{{ .Token }}</p>
                    <p style="margin:0;color:#9ca3af;font-size:13px;line-height:1.6;">This code expires shortly. Never share it with anyone.</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:20px 40px;border-top:1px solid #eef0f4;text-align:center;">
                    <p style="margin:0;color:#9ca3af;font-size:12px;line-height:1.6;">Disband &middot; chat, voice, and communities</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
