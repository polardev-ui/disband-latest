[package]
name = "disband"
version = "2.32.8"
description = "Disband — one codebase, every platform."
authors = ["Disband"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri's mobile/desktop entry points link against.
[lib]
name = "disband_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Minor-frozen (~) on purpose: Tauri refuses to build when the crate and NPM
# package differ on major/minor, pnpm stays frozen to its lockfile, and there
# is no Cargo.lock — so a bare "2" floats Rust to each new minor while JS
# stands still. Patch updates still float on both sides.
tauri = { version = "~2.12", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "~2.5"
# Desktop auto-update. Minor-frozen for the same reason as `tauri` above: the
# crate and its NPM half must agree on major/minor or Tauri refuses to build.
tauri-plugin-updater = "~2.9"
tauri-plugin-process = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin transitive `time` — 0.3.50 fails to compile against published time-macros 0.2.29.
time = "=0.3.49"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.6"
tauri-plugin-macos-permissions = "2"

[features]
# Used by the `tauri dev`/`tauri build` tooling.
custom-protocol = ["tauri/custom-protocol"]
