[package]
name = "disband"
version = "2.0.3"
description = "Disband — one codebase, every platform."
authors = ["Disband"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri's mobile/desktop entry points link against.
[lib]
name = "disband_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
# Pinned to the same minor as @tauri-apps/plugin-notification. Tauri refuses
# to build when the crate and NPM package differ on major/minor, and a bare
# "2" floats to each new minor while pnpm stays frozen to the lockfile.
tauri-plugin-notification = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin transitive `time` — 0.3.50 fails to compile against published time-macros 0.2.29.
time = "=0.3.49"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.6"
tauri-plugin-macos-permissions = "2"

[features]
# Used by the `tauri dev`/`tauri build` tooling.
custom-protocol = ["tauri/custom-protocol"]
