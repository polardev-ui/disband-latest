packages:
  - "."

# Both are legitimate native builds pulled in by Next.js. Left as the literal
# placeholder text pnpm scaffolds, these were never valid and pnpm exited
# non-zero on every install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@tauri-apps/plugin-notification@2.4.0'

# pnpm 10+ reads project settings from here instead of the package.json "pnpm" field.
onlyBuiltDependencies:
  - esbuild
  - workerd

# Don't fail `pnpm <script>` on the pre-run dependency check.
verifyDepsBeforeRun: false

# Security patches for transitive dependencies; keep within compatible majors.
overrides:
  postcss: ^8.5.28
  'nanoid@3': ^3.3.18
  'fast-uri@3': ^3.1.7
