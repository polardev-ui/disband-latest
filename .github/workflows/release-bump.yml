name: Prepare Release

# On every push to main: bump patch semver, commit version files, push a v* tag.
# That tag automatically triggers "Release Desktop" to build and publish installers.
# Use "Run workflow" manually when you want a minor or major bump instead.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for the next release"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  bump:
    # Skip the version-bump commit we just pushed (avoids loops if token triggers workflows).
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node scripts/next-release-version.mjs)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${VERSION}"

      - name: Update version files
        run: node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          if git diff --staged --quiet; then
            echo "Version files already at ${{ steps.ver.outputs.version }} — skipping."
            exit 0
          fi
          git commit -m "chore(release): ${{ steps.ver.outputs.tag }}"
          git tag "${{ steps.ver.outputs.tag }}"
          # refs/heads/main — never `git push origin main` (breaks if a tag named `main` exists).
          git push origin HEAD:refs/heads/main
          git push origin "refs/tags/${{ steps.ver.outputs.tag }}"
