name: Publish npm bot
on:
  push:
    tags: ['bot-js-v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Bump version if provided
        if: inputs.version
        run: |
          cd packages/bot
          npm version ${{ inputs.version }} --no-git-tag-version
      - name: Publish to npm
        run: cd packages/bot && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
